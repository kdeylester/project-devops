- name: Install Jenkins on master01
  hosts: master01
  become: true

  vars_files:
    - ../vars/jenkin-info.yaml


  roles:
    - role: geerlingguy.docker

  tasks:

    - name: Pull Jenkins image
      community.docker.docker_image:
        name: jenkins/jenkins
        tag: lts
        source: pull

    - name: Create Jenkins volume
      community.docker.docker_volume:
        name: jenkins_home

    - name: Run Jenkins container
      community.docker.docker_container:
        name: jenkins
        image: jenkins/jenkins:lts
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "127.0.0.1:8080:8080"   
          - "50000:50000"
        volumes:
          - jenkins_home:/var/jenkins_home

    - name: Install nginx and certbot
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Write nginx config for Jenkins
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/jenkins
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name {{ jenkins_domain }};

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_request_buffering off;
                  proxy_read_timeout 90s;
              }
          }
      notify: Reload nginx

    - name: Enable Jenkins site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/jenkins
        dest: /etc/nginx/sites-enabled/jenkins
        state: link
      notify: Reload nginx

    - name: Make sure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Flush handlers so nginx is configured before certbot
      ansible.builtin.meta: flush_handlers

    - name: Get HTTPS certificate (only runs once)
      ansible.builtin.command: >
        certbot --nginx -d {{ jenkins_domain }}
        --non-interactive --agree-tos -m {{ acme_email }} --redirect
      args:
        creates: /etc/letsencrypt/live/{{ jenkins_domain }}/fullchain.pem

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded